[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectrum-occupancy-forecasting"
version = "0.1.0"
description = "Occupancy prediction under sparse RF monitoring, on public AERPAW measurements."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/spectrum_occupancy_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # experiment scripts print wide result tables
